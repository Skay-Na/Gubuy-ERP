services:
  app:
    build: .
    image: erpwonchon-app:latest
    container_name: gubuy-erp-app
    restart: "no"
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - DB_USER=${DB_USER:-root}
      - DB_PASS=${DB_PASS:-rootpassword}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-erp_db}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set to a private value of at least 32 bytes}
      - BACKUP_UPLOAD_MAX_MB=${BACKUP_UPLOAD_MAX_MB:-200}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_API_URL=${AI_API_URL:-https://api.openai.com/v1/chat/completions}
      - AI_CONFIG_SECRET=${AI_CONFIG_SECRET:-}
      - AGENT_MONITOR_ENABLED=${AGENT_MONITOR_ENABLED:-0}
      - AGENT_RUNTIME_ENABLED=${AGENT_RUNTIME_ENABLED:-0}
      - AGENT_LLM_PLANNER_ENABLED=${AGENT_LLM_PLANNER_ENABLED:-0}
      - AGENT_PERSISTENT_SCHEDULER_ENABLED=${AGENT_PERSISTENT_SCHEDULER_ENABLED:-0}
      - ERP_SEED_DEMO_DATA=${ERP_SEED_DEMO_DATA:-0}
      - TZ=${TZ:-Asia/Shanghai}
    depends_on:
      db:
        condition: service_healthy # 等待数据库健康检查通过后再启动

  db:
    image: mysql:8.0
    container_name: gubuy-erp-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-erp_db}
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-log-bin
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p$$MYSQL_ROOT_PASSWORD",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
    name: gubuy-erp-mysql-data
