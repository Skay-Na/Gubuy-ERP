root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main ."
entrypoint = ["./tmp/main"]
delay = 500
include_ext = ["go"]
exclude_dir = ["tmp", ".tmp", ".cache", "docs", "scripts"]
exclude_regex = ["_test.go$"]
stop_on_error = true
send_interrupt = true
kill_delay = "1s"

[misc]
clean_on_exit = true
